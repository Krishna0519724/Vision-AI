<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vision AI</title>
<style>
:root{--bg:#f1f7f5;--fg:#0d2420;--mut:#45615b;--card:#fff;--bd:#bfd6cf;--ac:#0b6b5c;--acf:#fff;--gold:#b45f00;--em:#c62828;--emf:#fff;--c1:#d8f0ea;--c2:#fde9cc;--c3:#e1e6fb;--c4:#fbe0e6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08171a;--fg:#e9f6f2;--mut:#9fbdb5;--card:#102529;--bd:#264a4a;--ac:#5fd3b8;--acf:#06201b;--gold:#ffc83d;--em:#ff6b6b;--emf:#1a0505;--c1:#123a36;--c2:#3d2d0f;--c3:#1b2450;--c4:#45202a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08171a;--fg:#e9f6f2;--mut:#9fbdb5;--card:#102529;--bd:#264a4a;--ac:#5fd3b8;--acf:#06201b;--gold:#ffc83d;--em:#ff6b6b;--emf:#1a0505;--c1:#123a36;--c2:#3d2d0f;--c3:#1b2450;--c4:#45202a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:calc(100% * var(--s,1))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:1.05rem/1.55 "Noto Sans Devanagari","Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 0 84px}
main{max-width:720px;margin:0 auto;padding:0 16px 24px}main:focus{outline:none}
:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 0}
.bar .sp{flex:1}
button,select,input,textarea,.btn{font:inherit;color:inherit}
button,.btn{min-height:52px;padding:10px 18px;border-radius:14px;border:2px solid var(--ac);background:var(--card);cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.p,.btn.p{background:var(--ac);color:var(--acf)}
button.e,.btn.e{background:var(--em);border-color:var(--em);color:var(--emf)}
select,input,textarea{width:100%;min-height:52px;padding:10px 12px;border-radius:12px;border:2px solid var(--bd);background:var(--card)}
.bar select{width:auto}
h1{font-size:2.6rem;line-height:1.05;margin:12px 0 6px;letter-spacing:-.02em}
h2{font-size:1.6rem;margin:6px 0 10px}
h3{font-size:1.15rem;margin:14px 0 4px}
.tag{font-weight:700;color:var(--ac);margin:0}
.mut{color:var(--mut)}
.grid{display:grid;gap:14px;margin:18px 0}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.mode{min-height:150px;flex-direction:column;align-items:flex-start;text-align:left;justify-content:flex-end;border-width:3px;padding:16px;font-size:1.25rem}
.mode span{font-weight:400;font-size:1rem;color:var(--mut)}
.mode i{font-style:normal;font-size:2.6rem;line-height:1}
.m1{background:var(--c1)}.m2{background:var(--c2)}.m3{background:var(--c3)}.m4{background:var(--c4)}
.box{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px 16px;margin:12px 0}
.cap{font-size:2rem;line-height:1.3;min-height:9rem;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px;white-space:pre-wrap}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.chips button{border-radius:999px}
.aac{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.aac button{flex-direction:column;min-height:96px}
.aac i{font-style:normal;font-size:2rem}
.sos{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--bd);z-index:5}
.sos button{width:100%;max-width:720px;margin:0 auto;display:flex;min-height:58px;font-size:1.15rem}
.warn{border-left:6px solid var(--gold)}
.urgent{border-left:6px solid var(--em)}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:2.6rem;font-weight:800;background:var(--em);color:var(--emf);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{background:var(--bg);color:var(--fg)}}
@media(prefers-reduced-motion:reduce){.ov{animation:none}}
label{display:block;font-weight:600;margin:10px 0 4px}
video,canvas{width:100%;border-radius:14px;background:#000}
details summary{cursor:pointer;font-weight:700;min-height:44px}
:root[data-cb="1"]{--ac:#0072b2;--acf:#fff;--gold:#b35a00;--em:#b34700;--emf:#fff;--c1:#d6eaf8;--c2:#fcebb8;--c3:#f3dceb;--c4:#cdefe6}
@media(prefers-color-scheme:dark){:root[data-cb="1"]:not([data-theme="light"]){--ac:#56b4e9;--acf:#06121c;--gold:#f0e442;--em:#ff8a4c;--emf:#1a0a00;--c1:#12354d;--c2:#4a3a0a;--c3:#4a2340;--c4:#0f4a3f}}
:root[data-cb="1"][data-theme="dark"]{--ac:#56b4e9;--acf:#06121c;--gold:#f0e442;--em:#ff8a4c;--emf:#1a0a00;--c1:#12354d;--c2:#4a3a0a;--c3:#4a2340;--c4:#0f4a3f}
[data-cb="1"] .m2{border-style:dashed}[data-cb="1"] .m3{border-style:dotted}[data-cb="1"] .m4{border-style:double;border-width:6px}
[data-cb="1"] .urgent{border-left-style:double;border-left-width:10px}
button[aria-pressed="true"]{background:var(--ac);color:var(--acf)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--card);border-bottom:2px solid var(--bd)}
.hd-in{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);min-height:48px;border-radius:10px}
.hd .logo{flex:1 1 auto}
.logo svg{width:40px;height:40px;flex:none}
.logo b{display:block;font-size:1.2rem;letter-spacing:.02em;line-height:1.15}
.logo small{display:block;font-size:.82rem;color:var(--mut);line-height:1.25}
.hd nav{order:3;flex:1 1 100%;display:flex;flex-wrap:wrap;gap:4px}
@media(min-width:900px){.hd nav{order:0;flex:1 1 auto;justify-content:center}.hd .logo{flex:0 0 auto}}
.hd nav a,.ft nav a{color:var(--fg);text-decoration:none;padding:8px 12px;min-height:44px;display:inline-flex;align-items:center;border-radius:10px;font-weight:600}
.hd nav a:hover,.ft nav a:hover{text-decoration:underline;text-underline-offset:4px}
.hd nav a[aria-current="page"]{background:var(--ac);color:var(--acf)}
.ctl{display:flex;gap:8px;align-items:center}
.ctl select{width:auto;min-height:44px}.ctl button{min-height:44px;padding:6px 12px}
.skip{position:absolute;left:-9999px;top:0;z-index:30;background:var(--ac);color:var(--acf);padding:12px 16px;border-radius:0 0 10px 0;font-weight:700}
.skip:focus{left:0;top:env(safe-area-inset-top,0px)}
.ft{background:var(--card);border-top:2px solid var(--bd);margin-top:28px;color:var(--fg)}
.ft-in{max-width:1100px;margin:0 auto;padding:24px 16px;display:grid;gap:18px}
@media(min-width:700px){.ft-in{grid-template-columns:1fr 1.3fr}}
.ft ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:2px 6px}
.ft p{margin:6px 0}
.ft .cp{grid-column:1/-1;border-top:1px solid var(--bd);padding-top:14px;color:var(--mut);margin:0}

</style>
</head>
